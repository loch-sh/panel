# golangci-lint v2 configuration (CI: "API lint" in .github/workflows/checks.yml).
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  exclusions:
    presets:
      # Errors ignored by convention: Close, Flush, os.Remove(All),
      # fmt.Fprint*, os.Setenv/Unsetenv, writes to stdout/stderr.
      - std-error-handling
