# Generated by Loch.sh Panel (services). Boot without the panel with:
#   docker network create --internal --label sh.loch.managed=true loch-services   (once, if missing)
#   docker compose up -d
# Data lives outside this directory; deleting it does not delete the data.
name: svc-mongodb-8-0
x-loch:
  version: 2
  kind: database
  engine: mongodb
  engineVersion: "8.0"
services:
  svc:
    image: mirror.gcr.io/library/mongo:8.0
    container_name: svc-mongodb-8-0
    restart: unless-stopped
    command:
      - mongod
      - --maxConns
      - "200"
    environment:
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/admin_password
      MONGO_INITDB_ROOT_USERNAME: root
    secrets:
      - admin_password
    volumes:
      - type: bind
        source: /data/services/svc-mongodb-8-0
        target: /data/db
        bind:
          create_host_path: false
    networks:
      services:
        aliases:
          - svc-mongodb-8-0
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --norc
        - --eval
        - 'quit(db.adminCommand(''ping'').ok ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    tmpfs:
      - /data/configdb:noexec,nosuid,nodev,size=1m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    labels:
      sh.loch.instance: mongodb-8-0
      sh.loch.service: mongodb
      traefik.enable: "false"
secrets:
  admin_password:
    file: ./secrets/admin_password
networks:
  services:
    name: loch-services
    external: true
