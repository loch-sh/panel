# Generated by Loch.sh Panel (services). Boot without the panel with:
#   docker network create --internal --label sh.loch.managed=true loch-services   (once, if missing)
#   docker compose up -d
# Data lives outside this directory; deleting it does not delete the data.
name: svc-mosquitto-iot
x-loch:
  version: 2
  kind: queue
  engine: mosquitto
  engineVersion: "2.0"
  name: iot
  options:
    memory: "128"
    message-size: "1"
    persistence: "on"
    queued: "1000"
services:
  svc:
    image: mirror.gcr.io/library/eclipse-mosquitto:2.0.22
    container_name: svc-mosquitto-iot
    restart: unless-stopped
    user: 1883:1883
    command:
      - /usr/sbin/mosquitto
      - -c
      - /etc/loch/mosquitto.conf
    volumes:
      - type: bind
        source: /data/services/svc-mosquitto-iot
        target: /mosquitto/data
        bind:
          create_host_path: false
      - type: bind
        source: /data/services/.loch/svc-mosquitto-iot/state
        target: /etc/loch/state
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mosquitto.conf
        target: /etc/loch/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./listener.conf
        target: /etc/loch/listener.d/listener.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      services:
        aliases:
          - svc-mosquitto-iot
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "1883"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 30s
    tmpfs:
      - /mosquitto/log:size=1m
    pids_limit: 64
    mem_limit: 134217728
    memswap_limit: 134217728
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    labels:
      sh.loch.instance: mosquitto-iot
      sh.loch.service: mosquitto
      traefik.enable: "false"
networks:
  services:
    name: loch-services
    external: true
