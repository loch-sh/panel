# Generated by Loch.sh Panel (services). Boot without the panel with:
#   docker network create --internal --label sh.loch.managed=true loch-services   (once, if missing)
#   docker compose up -d
# Data lives outside this directory; deleting it does not delete the data.
name: svc-postgres-16
x-loch:
  version: 2
  kind: database
  engine: postgres
  engineVersion: "16"
services:
  svc:
    image: mirror.gcr.io/library/postgres:16
    container_name: svc-postgres-16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - hba_file=/etc/loch/pg_hba.conf
      - -c
      - log_min_error_statement=panic
      - -c
      - password_encryption=scram-sha-256
      - -c
      - authentication_timeout=10s
      - -c
      - max_connections=200
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_USER: postgres
    secrets:
      - admin_password
    volumes:
      - type: bind
        source: /data/services/svc-postgres-16
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ./pg_hba.conf
        target: /etc/loch/pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      services:
        aliases:
          - svc-postgres-16
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -h
        - 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    shm_size: 256m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    labels:
      sh.loch.instance: postgres-16
      sh.loch.service: postgres
      traefik.enable: "false"
secrets:
  admin_password:
    file: ./secrets/admin_password
networks:
  services:
    name: loch-services
    external: true
