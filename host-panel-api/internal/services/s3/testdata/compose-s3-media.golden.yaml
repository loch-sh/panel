# Generated by Loch.sh Panel (services). Boot without the panel with:
#   docker network create --internal --label sh.loch.managed=true loch-services   (once, if missing)
#   docker compose up -d
# Data lives outside this directory; deleting it does not delete the data.
name: svc-s3-media
x-loch:
  version: 2
  kind: storage
  engine: s3
  engineVersion: "1.4"
  name: media
  options:
    encryption: "off"
    memory: "256"
    quota: "10240"
services:
  svc:
    image: ghcr.io/loch-sh/s3:1.4.0
    container_name: svc-s3-media
    restart: unless-stopped
    user: 10001:10001
    command:
      - s3
    environment:
      S3_INIT_BUCKETS: media
      S3_MAX_BLOCKING_THREADS: "32"
      S3_MAX_STORAGE_BYTES: "10737418240"
      S3_USERS_FILE: /etc/loch/state/users.json
    volumes:
      - type: bind
        source: /data/services/svc-s3-media
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /data/services/.loch/svc-s3-media/state
        target: /etc/loch/state
        read_only: true
        bind:
          create_host_path: false
    networks:
      services:
        aliases:
          - svc-s3-media
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/_loch/health
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=16m
    pids_limit: 128
    mem_limit: 268435456
    memswap_limit: 268435456
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    labels:
      sh.loch.instance: s3-media
      sh.loch.service: s3
      traefik.enable: "false"
networks:
  services:
    name: loch-services
    external: true
