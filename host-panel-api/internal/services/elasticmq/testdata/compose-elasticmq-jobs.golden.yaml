# Generated by Loch.sh Panel (services). Boot without the panel with:
#   docker network create --internal --label sh.loch.managed=true loch-services   (once, if missing)
#   docker compose up -d
# Data lives outside this directory; deleting it does not delete the data.
name: svc-elasticmq-jobs
x-loch:
  version: 2
  kind: queue
  engine: elasticmq
  engineVersion: "1.7"
  name: jobs
  options:
    limits: strict
    memory: "256"
services:
  svc:
    image: mirror.gcr.io/softwaremill/elasticmq-native:1.7.1
    container_name: svc-elasticmq-jobs
    restart: unless-stopped
    user: 10002:10002
    volumes:
      - type: bind
        source: /data/services/svc-elasticmq-jobs
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /data/services/.loch/svc-elasticmq-jobs/state
        target: /etc/loch/state
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./elasticmq.conf
        target: /opt/elasticmq.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      services:
        aliases:
          - svc-elasticmq-jobs
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9324/?Action=ListQueues
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=16m
    pids_limit: 128
    mem_limit: 268435456
    memswap_limit: 268435456
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    labels:
      sh.loch.instance: elasticmq-jobs
      sh.loch.service: elasticmq
      traefik.enable: "false"
networks:
  services:
    name: loch-services
    external: true
