# Generated by Loch.sh Panel (services). Boot without the panel with:
#   docker network create --internal --label sh.loch.managed=true loch-services   (once, if missing)
#   docker compose up -d
# Data lives outside this directory; deleting it does not delete the data.
name: svc-mysql-8-4
x-loch:
  version: 2
  kind: database
  engine: mysql
  engineVersion: "8.4"
services:
  svc:
    image: mirror.gcr.io/library/mysql:8.4
    container_name: svc-mysql-8-4
    restart: unless-stopped
    command:
      - mysqld
      - --disable-log-bin
      - --mysql-native-password=ON
      - --max-connections=200
      - --skip-name-resolve
      - --max-connect-errors=100000
      - --local-infile=0
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    volumes:
      - type: bind
        source: /data/services/svc-mysql-8-4
        target: /var/lib/mysql
        bind:
          create_host_path: false
    networks:
      services:
        aliases:
          - svc-mysql-8-4
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    labels:
      sh.loch.instance: mysql-8-4
      sh.loch.service: mysql
      traefik.enable: "false"
secrets:
  admin_password:
    file: ./secrets/admin_password
networks:
  services:
    name: loch-services
    external: true
