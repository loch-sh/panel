# Generated by Loch.sh Panel (services). Boot without the panel with:
#   docker network create --internal --label sh.loch.managed=true loch-services   (once, if missing)
#   docker compose up -d
# Data lives outside this directory; deleting it does not delete the data.
name: svc-mariadb-11-4
x-loch:
  version: 2
  kind: database
  engine: mariadb
  engineVersion: "11.4"
services:
  svc:
    image: mirror.gcr.io/library/mariadb:11.4
    container_name: svc-mariadb-11-4
    restart: unless-stopped
    command:
      - mariadbd
      - --max-connections=200
      - --skip-name-resolve
      - --max-connect-errors=100000
      - --local-infile=0
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_ROOT_HOST: localhost
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    volumes:
      - type: bind
        source: /data/services/svc-mariadb-11-4
        target: /var/lib/mysql
        bind:
          create_host_path: false
    networks:
      services:
        aliases:
          - svc-mariadb-11-4
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    labels:
      sh.loch.instance: mariadb-11-4
      sh.loch.service: mariadb
      traefik.enable: "false"
secrets:
  admin_password:
    file: ./secrets/admin_password
networks:
  services:
    name: loch-services
    external: true
