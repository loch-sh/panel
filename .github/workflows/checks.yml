name: Checks

# The checks of the API, the interface and the production examples, called
# by ci.yml (every push to main and every pull request) and release.yml
# (release tags, only for the released project). Runners are GitHub-hosted
# (ephemeral VMs); pull requests from forks run with a read-only token and no
# secret.

on:
  workflow_call:
    inputs:
      api:
        type: boolean
        default: true
      interface:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api-test:
    name: API tests
    if: inputs.api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: host-panel-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: host-panel-api/go.mod
          cache-dependency-path: host-panel-api/go.sum
          check-latest: true

      - name: gofmt
        run: |
          out=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # golangci-lint (configuration: host-panel-api/.golangci.yml), blocking.
  api-lint:
    name: API lint
    if: inputs.api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: host-panel-api/go.mod
          cache-dependency-path: host-panel-api/go.sum
          check-latest: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: host-panel-api
          args: --max-issues-per-linter 0 --max-same-issues 0

  # ESLint (zero warnings), type check, translations, Vitest with coverage,
  # Playwright on the mocked API.
  interface:
    name: Interface ${{ matrix.check }}
    if: inputs.interface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test, e2e]
    defaults:
      run:
        working-directory: host-panel-interface
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Node >= 25 no longer bundles corepack (nor yarn).
      - name: Yarn
        run: |
          npm install -g corepack@0.36.0
          corepack enable
          yarn install --immutable

      - name: Lint
        if: matrix.check == 'lint'
        run: yarn lint

      - name: Type check, translations, unit tests
        if: matrix.check == 'test'
        run: |
          yarn typecheck
          yarn i18n:check
          yarn coverage

      - name: End-to-end tests
        if: matrix.check == 'e2e'
        run: |
          npx playwright install --with-deps chromium
          yarn test:e2e

      - name: Keep the end-to-end results
        if: matrix.check == 'e2e' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: host-panel-interface/test-results/
          retention-days: 7

  # The production examples (example/): each compose file is valid with its
  # .env.example and app.env.example, and every image it references exists.
  # Not on release tags: the examples are bumped to a version after its
  # images are published, and a release must not depend on them.
  examples:
    name: Examples
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: docker compose config
        working-directory: example
        run: |
          for dir in */; do
            dir=${dir%/}
            echo "::group::$dir"
            cp "$dir/app.env.example" "$dir/app.env"
            docker compose --project-directory "$dir" --env-file "$dir/.env.example" config --quiet
            # Images pulled from a registry only: a service with `build`
            # (web-build) is built from this repository's sources.
            docker compose --project-directory "$dir" --env-file "$dir/.env.example" config --format json \
              | jq -r '.services[] | select(.build == null) | .image' >> images.txt
            echo "::endgroup::"
          done

      - name: Images exist
        working-directory: example
        run: |
          status=0
          for image in $(sort -u images.txt); do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "ok      $image"
            else
              echo "::error::image not found: $image"; status=1
            fi
          done
          exit $status
