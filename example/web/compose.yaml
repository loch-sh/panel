# Loch.sh Panel — full web hosting server ("web agency" mode).
#
#   1. Ingress   traefik
#   2. Panel     api (hosting, SFTP and services plugins enabled), interface
#   3. Deploy    deploy (GitLab CI deployments, github.com/loch-sh/deploy)
#   4. SFTP      sftpgo
#
# Every value to adapt is in .env (copy .env.example) and app.env (copy
# app.env.example): this file needs no edit. See README.md.

name: loch

services:

  # ── 1. Ingress ──────────────────────────────────────────────────────────────

  traefik:
    image: mirror.gcr.io/library/traefik:v3.7
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Network used to reach a container that has no traefik.docker.network
      # label (hosted sites and CI stacks join it).
      - "--providers.docker.network=traefik_default"
      # No redirection on the entrypoint: it would apply before the routers,
      # to the hosted sites with HTTPS off too. HTTP -> HTTPS is the
      # "http-to-https" router below (lowest priority) and, per site, the
      # redirect the hosting plugin adds when "Redirect to HTTPS" is on.
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http3"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s"
      # "letsencrypt" is the resolver the hosting plugin puts on the sites
      # (HOSTING_TRAEFIK_CERTRESOLVER default).
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.filePath=/var/log/traefik/traefik.log"
      - "--accesslog.filePath=/var/log/traefik/access.log"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "${DATA_ROOT:-/data}/traefik/letsencrypt:/letsencrypt"
      - "${DATA_ROOT:-/data}/traefik/logs:/var/log/traefik"
      # Root-equivalent access to the host, :ro does not change that (see README).
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      traefik_default: {}
      panel:
        ipv4_address: 10.255.252.2    # = TRUSTED_PROXIES of the api (app.env)
      deploy:
        ipv4_address: 10.255.250.2    # = TRUSTED_PROXIES of the deploy service
      sftpgo:
        ipv4_address: 10.255.251.2    # = PROXY_ALLOWED of the sftpgo service
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "system=true"
      # Catch-all HTTP -> HTTPS redirect (panel, deploy-server, SFTPGo web
      # client, sites without an HTTP router): priority 1, so any router
      # of a host on the web entrypoint (a site with HTTPS off) wins.
      - "traefik.enable=true"
      - "traefik.http.routers.http-to-https.rule=PathPrefix(`/`)"
      - "traefik.http.routers.http-to-https.entrypoints=web"
      - "traefik.http.routers.http-to-https.priority=1"
      - "traefik.http.routers.http-to-https.middlewares=http-to-https"
      - "traefik.http.routers.http-to-https.service=noop@internal"
      - "traefik.http.middlewares.http-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.http-to-https.redirectscheme.permanent=true"

  # ── 2. Panel ────────────────────────────────────────────────────────────────

  api:
    image: ghcr.io/loch-sh/panel/api:v1.1.0
    restart: unless-stopped
    env_file:
      - app.env
    volumes:
      # Users, API keys, scheduled tasks, private networks registry
      - "${DATA_ROOT:-/data}/panel/data:/app/data"
      # Audit trail (audit.log)
      - "${DATA_ROOT:-/data}/panel/log:/app/log"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Same path inside and outside the container: `docker compose` resolves
      # the paths in the container, the Docker daemon on the host.
      - "${DATA_ROOT:-/data}/compose:${DATA_ROOT:-/data}/compose"                   # HOSTING_STACKS_DIRECTORY
      - "${DATA_ROOT:-/data}/websites/hosted:${DATA_ROOT:-/data}/websites/hosted"   # HOSTING_SITES_DIRECTORY
      - "${DATA_ROOT:-/data}/services:${DATA_ROOT:-/data}/services"                 # SERVICES_DATA_DIRECTORY
    # Healthcheck: defined in the image (GET /_health on :2538).
    networks:
      panel:
        ipv4_address: 10.255.252.3
      # Reaches the SFTPGo admin API (SFTP_API_URL in app.env).
      sftpgo:
        ipv4_address: 10.255.251.4
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panel-api.rule=Host(`manager.api.${DOMAIN:?set DOMAIN in .env}`)"
      - "traefik.http.routers.panel-api.entrypoints=websecure"
      - "traefik.http.routers.panel-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.panel-api.loadbalancer.server.port=2538"
      - "traefik.docker.network=loch-panel"
      - "system=true"

  interface:
    image: ghcr.io/loch-sh/panel/interface:v1.1.1
    restart: unless-stopped
    environment:
      API_URL: "https://manager.api.${DOMAIN}"
      WS_URL: "wss://manager.api.${DOMAIN}"
      # APP_NAME: "My Hosting"
      # SUPPORT_URL: "https://support.example.com"
    # Branding: logo.svg / favicon.svg in ./branding
    # volumes:
    #   - ./branding:/branding:ro
    networks:
      panel:
        ipv4_address: 10.255.252.4
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panel-interface.rule=Host(`manager.${DOMAIN}`)"
      - "traefik.http.routers.panel-interface.entrypoints=websecure"
      - "traefik.http.routers.panel-interface.tls.certresolver=letsencrypt"
      - "traefik.http.services.panel-interface.loadbalancer.server.port=80"
      - "traefik.docker.network=loch-panel"
      - "system=true"

  # ── 3. Deploy ───────────────────────────────────────────────────────────────

  deploy:
    image: ghcr.io/loch-sh/deploy:1
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      # Same path inside and outside the container (the daemon resolves bind
      # sources on the host). COMPOSE_BASE is also the panel's
      # HOSTING_STACKS_DIRECTORY: CI stacks show up in the panel.
      COMPOSE_BASE: "${DATA_ROOT:-/data}/compose"
      WEBSITES_BASE: "${DATA_ROOT:-/data}/websites"
      DATA_DIR: "/app/data"
      MAX_UPLOAD_MB: "20"
      # GitLab OIDC authentication.
      GITLAB_ISSUER: "https://${GITLAB_HOST:?set GITLAB_HOST in .env}"
      GITLAB_AUDIENCE: "https://deploy.${DOMAIN}"   # = aud of id_tokens in .gitlab-ci.yml
      PROTECTED_ENVS: "production"
      # GitLab groups allowed to deploy (empty = the whole GitLab instance).
      ALLOWED_NAMESPACES: "${DEPLOY_NAMESPACES:?set DEPLOY_NAMESPACES in .env}"
      # Hosts no deployed stack may claim in a Traefik Host() rule: every
      # public host of this file, and GitLab's.
      FORBIDDEN_TRAEFIK_HOSTS: "deploy.${DOMAIN},manager.${DOMAIN},manager.api.${DOMAIN},ftp.${DOMAIN},${GITLAB_HOST}"
      # External networks deployed stacks may join. Never add loch-panel,
      # loch-deploy or loch-sftpgo.
      ALLOWED_EXTERNAL_NETWORKS: "traefik_default"
      # Client IPs/CIDRs allowed to call the API (CI runners). /health is exempt.
      ALLOWED_IPS: "${DEPLOY_ALLOWED_IPS:?set DEPLOY_ALLOWED_IPS in .env}"
      # The client IP is read from X-Forwarded-For only when the peer is
      # Traefik's fixed IP on loch-deploy, never a whole Docker range.
      TRUSTED_PROXIES: "10.255.250.2"
    # No published port and not on traefik_default: only Traefik reaches it.
    networks:
      deploy:
        ipv4_address: 10.255.250.3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deploy-server.rule=Host(`deploy.${DOMAIN}`)"
      - "traefik.http.routers.deploy-server.entrypoints=websecure"
      - "traefik.http.routers.deploy-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.deploy-server.loadbalancer.server.port=8080"
      - "traefik.docker.network=loch-deploy"
      - "system=true"
    volumes:
      # Server state (registry.json, autostop.json)
      - "${DATA_ROOT:-/data}/deploy:/app/data"
      # Root-equivalent access to the host (github.com/loch-sh/deploy, SECURITY.md).
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${DATA_ROOT:-/data}/compose:${DATA_ROOT:-/data}/compose"
      - "${DATA_ROOT:-/data}/websites:${DATA_ROOT:-/data}/websites"
      # Private registries: mount a docker config read-only.
      # - /root/.docker/config.json:/root/.docker/config.json:ro
    # Root by design, but with only the capabilities it uses.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    pids_limit: 512
    stop_grace_period: 40s
    # Healthcheck: defined in the image (GET /health).

  # ── 4. SFTP ─────────────────────────────────────────────────────────────────

  sftpgo:
    image: mirror.gcr.io/drakkan/sftpgo:v2.7
    restart: unless-stopped
    user: "1000:1000"   # = HOSTING_RUN_UID / HOSTING_RUN_GID of the api
    environment:
      SFTPGO_SFTPD__BANNER: "SSH-2.0-OpenSSH_9.6"
      SFTPGO_SFTPD__BINDINGS__0__PORT: 2022
      SFTPGO_DATA_PROVIDER__DRIVER: sqlite
      # Binding 0: web client, routed by Traefik.
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: 0.0.0.0
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: "false"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "true"
      # No REST API (admin login included) on the public binding.
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API: "false"
      # Client IP from X-Forwarded-For, only when it comes from Traefik's
      # fixed IP: otherwise the defender would ban Traefik itself.
      SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED: "10.255.251.2"
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER: "X-Forwarded-For"
      # Binding 1: admin web interface and REST API (used by the panel over
      # loch-sftpgo; published on the host loopback only, see README).
      SFTPGO_HTTPD__BINDINGS__1__PORT: 8081
      SFTPGO_HTTPD__BINDINGS__1__ADDRESS: 0.0.0.0
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_ADMIN: "true"
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_CLIENT: "false"
      SFTPGO_COMMON__DEFENDER__ENABLED: "true"
      SFTPGO_COMMON__DEFENDER__BAN_TIME: 30
      SFTPGO_COMMON__DEFENDER__THRESHOLD: 10
      SFTPGO_LOG_FILE_PATH: /var/log/sftpgo/sftpgo.log
      SFTPGO_LOG_MAX_SIZE: 10
      SFTPGO_LOG_MAX_BACKUPS: 7
      SFTPGO_LOG_MAX_AGE: 30
      SFTPGO_LOG_COMPRESS: "true"
      SFTPGO_LOG_LEVEL: info
    ports:
      - "2022:2022"
      - "127.0.0.1:8081:8081"
    volumes:
      - "${DATA_ROOT:-/data}/sftpgo/data:/var/lib/sftpgo"
      - "${DATA_ROOT:-/data}/sftpgo/logs:/var/log/sftpgo"
      - "${DATA_ROOT:-/data}/sftpgo/config:/etc/sftpgo"
      # Same path as on the host and in the api: SFTP_DIRECTORY =
      # HOSTING_SITES_DIRECTORY, a site has one directory for both plugins.
      - "${DATA_ROOT:-/data}/websites/hosted:${DATA_ROOT:-/data}/websites/hosted"
    # Not on traefik_default: hosted containers cannot reach the admin API.
    networks:
      sftpgo:
        ipv4_address: 10.255.251.3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sftpgo.rule=Host(`ftp.${DOMAIN}`)"
      - "traefik.http.routers.sftpgo.entrypoints=websecure"
      - "traefik.http.routers.sftpgo.tls.certresolver=letsencrypt"
      - "traefik.http.services.sftpgo.loadbalancer.server.port=8080"
      - "traefik.docker.network=loch-sftpgo"
      - "system=true"

networks:
  # Shared with the hosted sites and the CI stacks. Created once per host
  # (docker network create traefik_default), subnet from the daemon's
  # default-address-pools. = HOSTING_TRAEFIK_NETWORK of the api.
  traefik_default:
    external: true

  # Traefik <-> one internal service each. Fixed /29 subnets outside the
  # daemon's default-address-pools, so Traefik has a fixed IP that the
  # services trust for X-Forwarded-For. Not `internal`: the services need
  # outbound access (OIDC discovery, registries).
  panel:
    name: loch-panel
    ipam:
      config:
        - subnet: 10.255.252.0/29
  deploy:
    name: loch-deploy
    ipam:
      config:
        - subnet: 10.255.250.0/29
  sftpgo:
    name: loch-sftpgo
    ipam:
      config:
        - subnet: 10.255.251.0/29
